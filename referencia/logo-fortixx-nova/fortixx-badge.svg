<svg width="200" height="200" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="40" height="40" rx="13" fill="url(#gold)"/>
  <!-- Três nós crescendo em diagonal: recrutamento -> onboarding -> portal.
       Mesma linguagem visual do ParticleCanvas (pontos conectados) já usado
       no fundo da landing — a marca "puxa" o motivo que já existe no produto. -->
  <line x1="12" y1="27" x2="20" y2="18" stroke="#1A1300" stroke-width="2.1" stroke-linecap="round"/>
  <line x1="20" y1="18" x2="29" y2="11" stroke="#1A1300" stroke-width="2.1" stroke-linecap="round"/>
  <circle cx="12" cy="27" r="3" fill="#1A1300"/>
  <circle cx="20" cy="18" r="3.6" fill="#1A1300"/>
  <circle cx="29" cy="11" r="4.2" fill="#1A1300"/>
</svg>
